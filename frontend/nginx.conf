# Serves the built SPA and proxies the API so the browser only ever talks to one origin.
server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Bigger than any request this app makes; keeps proxied POST bodies from being truncated.
  client_max_body_size 2m;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml font/ttf font/woff font/woff2 application/font-ttf;

  # Container-level probe for compose's healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # API lives on the private network. nginx resolves an upstream hostname once at startup,
  # so if the api container is recreated with a different IP the proxy would 502 until reloaded.
  # Using docker's embedded DNS (127.0.0.11) with a variable upstream forces re-resolution.
  location /api/ {
    resolver           127.0.0.11 valid=10s ipv6=off;
    set $api_upstream  api;
    proxy_pass         http://$api_upstream:3010$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    # Analytics responses are computed per range; let the API's own cache headers win.
    proxy_buffering    on;
  }

  # Hashed build output (index-a1b2c3.js) can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Static payloads referenced by the 3D scenes.
  location /textures/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location /fonts/    { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

  # index.html must never be cached or users get stale asset hashes after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA fallback: /geography, /orders/5000009020 … are client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
